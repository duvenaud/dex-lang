resolver: lts-22.42

packages:
- .

extra-deps:
  - github: llvm-hs/llvm-hs
    commit: 423220bffac4990d019fc088c46c5f25310d5a33
    subdirs:
      - llvm-hs
      - llvm-hs-pure


extra-include-dirs:
  - /usr/local/opt/llvm@16/include
extra-lib-dirs:
  - /usr/local/opt/llvm@16/lib

flags:
  llvm-hs:
    shared-llvm: false
